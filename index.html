<title>Orrery Score</title>
<style>
:root{--bg:#000;--ink:#fff;--dim:#8a8a8a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--ink:#fff}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Georgia,'Times New Roman',serif;padding:20px 16px 40px;animation:in 1.8s ease both}
@keyframes in{from{opacity:0}to{opacity:1}}
h1{margin:0;font-weight:normal;font-size:13px;letter-spacing:.45em;text-transform:uppercase;text-align:center}
.status{text-align:center;color:var(--dim);font-size:13px;min-height:22px;margin:8px 0 0;padding:0 8px}
.bar{display:flex;flex-wrap:wrap;gap:0 6px;justify-content:center;align-items:center}
button,select,input{font:inherit;color:var(--ink);background:none;border:0;border-radius:0;padding:0 8px;min-height:44px;cursor:pointer}
button:hover,select:hover{text-decoration:underline;text-underline-offset:5px}
button.on{text-decoration:underline;text-underline-offset:5px}
input[type=datetime-local],input[type=number]{border-bottom:1px solid #333;cursor:text;font:12px ui-monospace,Menlo,Consolas,monospace;padding:0 4px;min-height:36px}
input[type=number]{width:84px}
select{appearance:none;-webkit-appearance:none}select option{background:#000}
input[type=range]{display:block;width:min(92vw,620px);margin:0 auto;padding:0;accent-color:#fff;height:26px}
.dome{width:min(94vw,76vh);aspect-ratio:1;margin:4px auto}
.dome.wide{width:min(96vw,1100px);aspect-ratio:16/10}
@media(max-width:760px){.dome.wide{aspect-ratio:3/4}}
canvas{display:block;width:100%;height:100%}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:32px;max-width:980px;margin:22px auto 0;align-items:start}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
.mono{font:12px ui-monospace,Menlo,Consolas,monospace}
table{width:100%;border-collapse:collapse}td,th{padding:5px 4px;text-align:right;font-weight:normal}td:first-child,th:first-child{text-align:left}th{color:var(--dim)}
.dim{color:var(--dim);font-size:12px}
.orr{width:min(100%,460px);aspect-ratio:1;margin:0 auto}
.roll{height:100px;max-width:980px;margin:24px auto 0}
.center{text-align:center}
#credit{position:fixed;right:6px;bottom:calc(3px + env(safe-area-inset-bottom,0px));font:10px ui-monospace,Menlo,monospace;color:var(--dim);opacity:.5;text-decoration:none}
</style></head><body>
<h1>Orrery Score</h1>
<div class="status" id="status"></div>
<div class="bar">

 <input type="datetime-local" id="dt" aria-label="Date and time"><button id="snd">Sound off</button>
</div>
<input type="range" id="sc" min="0" max="1440" value="0" aria-label="Next 24 hours">
<div class="dome"><canvas id="sky"></canvas></div>
<div class="dim center" id="hint" style="min-height:18px"></div>
<div class="bar mono">
 <input type="number" id="lat" step="0.01" min="-90" max="90" aria-label="Latitude"><input type="number" id="lon" step="0.01" min="-180" max="180" aria-label="Longitude">
 <button id="loc">Use my location</button><span class="dim" id="msg"></span>
</div>
<div class="bar mono"><select id="scale" aria-label="Scale"></select><select id="root" aria-label="Root note"></select><span class="dim">Seed <span id="seed"></span></span></div>
<div class="cols">
 <div><div id="plan"></div></div>
 <div>
  <div class="orr"><canvas id="orr"></canvas></div>
  <div class="bar mono"><span class="dim">Line to</span><select id="osel" aria-label="Line to"></select><button id="scl">Compressed scale</button></div>
  <div class="center dim" id="oinfo"></div>
 </div>
</div>
<div class="roll"><canvas id="roll"></canvas></div>
<p class="dim center">Positions are approximate: planets to a fraction of a degree, the Moon to about half a degree. For planning only.</p>

}

const hor=(ra,dec,lst)=>{

/* ===== schedule: rise, transit, set, twilight, aspects over 48 h ===== */
let sched={ws:0,ev:[],samp:[]};
const TARGETS=[0,60,90,120,180,240,270,300];
function build(t){
 const ws=t-6*HR,ev=[],samp=[];let P=null;
 for(let k=0;k<=288;k++){
  const t1=ws+k*STEP,S=state(t1);
  samp.push({t:t1,alt:S.map(b=>b.alt)});
  if(P){
   const t0=t1-STEP,at=(a,b,v)=>t0+STEP*(v-a)/(b-a);
   for(let i=0;i<9;i++){
    const h0=i<2?-.833:-.57,a=P[i].alt-h0,b=S[i].alt-h0;
    if(a<0&&b>=0)ev.push({t:at(a,b,0),type:'rise',i});
    if(a>=0&&b<0)ev.push({t:at(a,b,0),type:'set',i});
    if(P[i].ha<0&&S[i].ha>=0&&S[i].ha<90)ev.push({t:at(P[i].ha,S[i].ha,0),type:'transit',i});
   }
   for(const[h,n]of[[-6,'Civil twilight'],[-12,'Nautical twilight'],[-18,'Astronomical twilight']]){
    const a=P[0].alt-h,b=S[0].alt-h;
    if(a>=0&&b<0)ev.push({t:at(a,b,0),type:'tw',label:n+' ends'});
    if(a<0&&b>=0)ev.push({t:at(a,b,0),type:'tw',label:n+' begins'});
   }
   for(let i=0;i<9;i++)for(let j=i+1;j<9;j++)for(const tg of TARGETS){
    const e0=norm(P[i].lon-P[j].lon-tg+180)-180,e1=norm(S[i].lon-S[j].lon-tg+180)-180;
    if(Math.abs(e0)<20&&Math.abs(e1)<20&&(e0<0)!==(e1<0))ev.push({t:at(e0,e1,0),type:'aspect',i,j,ang:tg>180?360-tg:tg});
   }
  }
  P=S;
 }
 ev.sort((a,b)=>a.t-b.t);
 return{ws,ev,samp};
}

  const k=fov/($('sky').clientHeight||600);
  yaw=norm(yaw-dx*k);tilt=clamp(tilt+dy*k,-5,90);

 });
